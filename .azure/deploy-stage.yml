parameters:
- name: environment
  type: string
- name: dependsOn
  type: string

stages:
- stage: ${{ parameters.environment }}
  dependsOn: ${{ parameters.dependsOn }}
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  variables:
  - group: futprediction-${{ parameters.environment }}
  jobs:
  - deployment: DeployBackend
    displayName: Promover el JAR a ${{ parameters.environment }}
    # Configurar Approvals and checks en PDN desde Azure DevOps ANTES de activar CD.
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none
          - download: current
            artifact: futprediction
          - bash: python3 "$(Pipeline.Workspace)/futprediction/deployment/verify_release.py" --artifact-dir "$(Pipeline.Workspace)/futprediction"
            displayName: Verificar el hash del artefacto descargado
          - task: AzureCLI@2
            displayName: Configurar variables y secretos del ambiente
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: python3 "$(Pipeline.Workspace)/futprediction/deployment/azure_settings.py"
            env:
              AZURE_RESOURCE_GROUP: $(AZURE_RESOURCE_GROUP)
              AZURE_WEBAPP_NAME: $(AZURE_WEBAPP_NAME)
              APP_ENVIRONMENT: ${{ parameters.environment }}
              DB_URL: $(DB_URL)
              DB_USERNAME: $(DB_USERNAME)
              DB_PASSWORD: $(DB_PASSWORD)
              JWT_SECRET: $(JWT_SECRET)
              API_SPORTS_KEY: $(API_SPORTS_KEY)
          - task: AzureWebApp@1
            displayName: Desplegar el mismo JAR sin recompilar
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              appType: webAppLinux
              appName: $(AZURE_WEBAPP_NAME)
              package: '$(Pipeline.Workspace)/futprediction/app.jar'
              runtimeStack: 'JAVA|17-java17'
              startUpCommand: 'java -jar /home/site/wwwroot/app.jar'
          - bash: >-
              python3 "$(Pipeline.Workspace)/futprediction/deployment/verify_release.py"
              --artifact-dir "$(Pipeline.Workspace)/futprediction"
              --url "$(APP_BASE_URL)/api/v1/hello"
              --environment "${{ parameters.environment }}"
            displayName: Validar ambiente, version y commit publicados
