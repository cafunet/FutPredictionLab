<div class="confirm-backdrop" (click)="onBackdropClick($event)" role="presentation">
  <div class="confirm-panel" role="alertdialog" [attr.aria-labelledby]="'confirm-title'" aria-modal="true">
    <div class="confirm-panel__body">
      <div class="confirm-panel__icon" [class.confirm-panel__icon--danger]="variant === 'danger'"
        [class.confirm-panel__icon--warning]="variant === 'warning'"
        [class.confirm-panel__icon--primary]="variant === 'primary'">
        @if (variant === 'danger') {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        } @else if (variant === 'warning') {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
      </div>

      <div class="confirm-panel__content">
        <h3 id="confirm-title" class="confirm-panel__title">{{ data.title }}</h3>
        @for (paragraph of messageParagraphs; track paragraph) {
          <p class="confirm-panel__message">{{ paragraph }}</p>
        }
      </div>
    </div>

    <div class="confirm-panel__footer">
      <button type="button" class="confirm-btn confirm-btn--cancel" (click)="cancel()">
        {{ data.cancelLabel ?? 'Cancelar' }}
      </button>
      <button type="button" class="confirm-btn"
        [class.confirm-btn--danger]="variant === 'danger'"
        [class.confirm-btn--warning]="variant === 'warning'"
        [class.confirm-btn--primary]="variant === 'primary'"
        (click)="confirm()">
        {{ data.confirmLabel ?? 'Aceptar' }}
      </button>
    </div>
  </div>
</div>
