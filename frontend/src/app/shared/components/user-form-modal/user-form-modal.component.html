<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4"
  (click)="onBackdropClick($event)">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden animate-fade-in-up">
    <!-- Header -->
    <div class="bg-blue-600 p-6 relative overflow-hidden flex justify-between items-center text-white">
      <h3 class="text-xl font-bold">{{ user ? 'Editar Usuario' : 'Crear Usuario' }}</h3>
      <button (click)="close()" class="text-blue-200 hover:text-white p-2 z-20">
        <svg class="w-6 h-6 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6">
      @if (validationError()) {
      <p class="mb-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2" role="alert">
        {{ validationError() }}
      </p>
      }
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre</label>
          <input #userName type="text" [value]="user?.fullName || ''" placeholder="Nombre completo"
            class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 outline-none transition-all">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Email</label>
          <input #userEmail type="email" [value]="user?.email || ''" placeholder="correo@ejemplo.com"
            class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 outline-none transition-all">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Contraseña <span
              class="font-normal text-gray-400">{{ user ? '(Dejar en blanco para no cambiar)' : '' }}</span></label>
          <input #userPassword type="password" placeholder="Min. 6 caracteres"
            class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 outline-none transition-all">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Rol</label>
          <select #userRole
            class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 outline-none transition-all">
            @for (r of roles; track r) {
            <option [value]="r" [selected]="r === (user?.role || 'USER')">{{ r }}</option>
            }
          </select>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 bg-gray-50 border-t flex justify-end gap-3">
      <button (click)="close()"
        class="px-4 py-2 text-sm font-semibold text-gray-600 hover:text-gray-800 transition-colors">
        Cancelar
      </button>
      <button (click)="save(userName.value, userEmail.value, userRole.value, userPassword.value)"
        class="px-6 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold shadow hover:bg-blue-700 transition-colors">
        {{ user ? 'Guardar Cambios' : 'Crear Usuario' }}
      </button>
    </div>
  </div>
</div>
