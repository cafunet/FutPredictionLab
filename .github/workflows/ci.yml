name: CI complementaria - GitHub Actions

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Probar Java y construir JAR
        run: >-
          mvn -B -ntp -f backend_proyecto/pom.xml
          -Dlab.build.version=github-${{ github.run_number }}-${{ github.run_attempt }}
          -Dlab.build.commit=${{ github.sha }} clean verify
      - name: Conservar informes Java
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: backend_proyecto/target/surefire-reports/
          if-no-files-found: warn
      - name: Probar y compilar Angular
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watch=false
          npm run build -- --configuration docker
      - name: Preparar artefacto y trazabilidad
        run: >-
          python3 scripts/package_release.py --output .artifacts/ci
          --version github-${{ github.run_number }}-${{ github.run_attempt }}
          --commit ${{ github.sha }}
      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: futprediction-${{ github.run_number }}-${{ github.run_attempt }}
          path: .artifacts/ci/
          if-no-files-found: error
          retention-days: 7
